{% if messages %}
    <div class="mb-3" aria-live="polite" aria-atomic="false">
        {% for message in messages %}
            <div class="alert alert-{% if message.level_tag == 'error' %}danger{% else %}{{ message.level_tag }}{% endif %} py-2 px-3" role="alert">
                {{ message }}
            </div>
        {% endfor %}
    </div>
{% endif %}
