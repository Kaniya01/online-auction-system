{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Product | AuctionHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{% static 'css/dashboard.css' %}">

</head>

<body>

<nav class="navbar navbar-auction">

    <div class="container">

        <a class="navbar-brand"
           href="{% url 'dashboard' %}">

            <i class="bi bi-hammer me-2"></i>

            <span class="brand-main">Auction</span><span class="brand-light">Hub</span>

        </a>

    </div>

</nav>


<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="section-card">

                <div class="section-card-header">

                    <div>

                        <span class="section-kicker">
                            SELLER
                        </span>

                        <h2>
                            Edit Product
                        </h2>

                    </div>

                </div>


                <div class="section-card-body">

                    <form method="POST">

                        {% csrf_token %}

                        {% if form.non_field_errors %}

                        <div class="alert alert-danger">

                            {{ form.non_field_errors }}

                        </div>

                        {% endif %}


                        {% for field in form %}

                        <div class="mb-3">

                            <label class="form-label">
                                {{ field.label }}
                            </label>

                            {{ field }}

                            {% if field.errors %}

                            <div class="text-danger small mt-1">

                                {{ field.errors }}

                            </div>

                            {% endif %}

                        </div>

                        {% endfor %}


                        <div class="d-flex gap-2 mt-4">

                            <button type="submit"
                                    class="btn btn-auction-primary">

                                <i class="bi bi-check-lg me-1"></i>

                                Save Changes

                            </button>

                            <a href="{% url 'seller_products' %}"
                               class="btn btn-outline-secondary">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</main>

</body>

</html>
