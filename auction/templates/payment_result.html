<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Details | AuctionHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f3ff;
            color: #25213b;
            font-family: Arial, sans-serif;
        }

        .payment-card {
            max-width: 650px;
            margin: 60px auto;
            padding: 32px;
            background: #fff;
            border: 1px solid #e8e2ff;
            border-radius: 18px;
            box-shadow: 0 6px 20px rgba(74, 45, 130, 0.08);
        }

        h1 {
            color: #382568;
            margin-bottom: 24px;
        }

        .detail-row {
            padding: 12px 0;
            border-bottom: 1px solid #eee9ff;
        }

        .btn-purple {
            background: #6d28d9;
            border: 1px solid #6d28d9;
            color: #fff;
        }

        .btn-purple:hover {
            background: #5b21b6;
            border-color: #5b21b6;
            color: #fff;
        }

        .btn-outline-purple {
            border: 1px solid #6d28d9;
            color: #6d28d9;
            background: #fff;
        }

        .btn-outline-purple:hover {
            background: #ede9fe;
            color: #5b21b6;
        }
    </style>
</head>
<body>
    <main class="payment-card">
        <h1>Payment Details</h1>

        <div class="detail-row">
            <strong>Item:</strong> {{ payment.auction.product }}
        </div>
        <div class="detail-row">
            <strong>Amount:</strong> ₹{{ payment.amount }}
        </div>
        <div class="detail-row">
            <strong>Payment method:</strong> {{ payment.get_payment_method_display }}
        </div>
        <div class="detail-row">
            <strong>Status:</strong> {{ payment.get_payment_status_display }}
        </div>
        <div class="detail-row">
            <strong>Transaction reference:</strong> {{ payment.transaction_reference }}
        </div>

        <div class="d-flex flex-wrap gap-2 mt-4">
            <a href="{% url 'my_payments' %}" class="btn btn-purple">
                View My Payments
            </a>
            <a href="{% url 'dashboard' %}" class="btn btn-outline-purple">
                Back to Dashboard
            </a>
        </div>
    </main>
</body>
</html>
