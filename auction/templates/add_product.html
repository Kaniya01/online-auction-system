<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product | AuctionHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f6f7f9;
        }

        .product-form-container {
            max-width: 700px;
            margin: 50px auto;
        }

        .form-card {
            background: white;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(23, 33, 59, 0.08);
        }

        h1 {
            color: #17213b;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #707887;
            margin-bottom: 25px;
        }

        .btn-submit {
            background-color: #c99a3e;
            border: none;
            color: #17213b;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 8px;
        }

        .btn-submit:hover {
            background-color: #a77a25;
            color: white;
        }
    </style>
</head>

<body>

<div class="container product-form-container">

    <div class="form-card">

        <h1>Add Product</h1>

        <p class="subtitle">
            Enter the details of the product you want to sell.
        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="mt-4">
                <button type="submit" class="btn btn-submit">
                    Add Product
                </button>

                <a href="{% url 'dashboard' %}"
                   class="btn btn-outline-secondary ms-2">
                    Cancel
                </a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
