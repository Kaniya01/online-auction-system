<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Payment | AuctionHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f3ff;
            color: #25213b;
            font-family: Arial, sans-serif;
        }

        .payment-card {
            max-width: 650px;
            margin: 60px auto;
            padding: 32px;
            background: #fff;
            border: 1px solid #e8e2ff;
            border-radius: 18px;
            box-shadow: 0 6px 20px rgba(74, 45, 130, 0.08);
        }

        h1 {
            color: #382568;
            margin-bottom: 24px;
        }

        .amount-box {
            background: #f3efff;
            border: 1px solid #e8e2ff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .form-select {
            border-color: #d8ccf7;
            padding: 10px;
        }

        .form-select:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 0.2rem rgba(109, 40, 217, 0.15);
        }

        .btn-purple {
            background: #6d28d9;
            border: 1px solid #6d28d9;
            color: #fff;
        }

        .btn-purple:hover {
            background: #5b21b6;
            border-color: #5b21b6;
            color: #fff;
        }

        .btn-outline-purple {
            border: 1px solid #6d28d9;
            color: #6d28d9;
            background: #fff;
        }

        .btn-outline-purple:hover {
            background: #ede9fe;
            color: #5b21b6;
        }

        .demo-note {
            color: #6b5a91;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <main class="payment-card">
        <h1>Make Payment</h1>

        <div class="amount-box">
            <p class="mb-1"><strong>Item:</strong> {{ auction.product }}</p>
            <p class="mb-0">
                <strong>Amount to pay:</strong>
                <span class="fs-4 fw-bold text-primary">
                    ₹{{ auction.current_highest_bid|floatformat:2 }}
                </span>
            </p>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label for="payment_method" class="form-label">
                    Choose payment method
                </label>

                <select
                    name="payment_method"
                    id="payment_method"
                    class="form-select"
                    required
                >
                    <option value="">Select a method</option>
                    <option value="UPI">UPI</option>
                    <option value="CARD">Card</option>
                    <option value="NET_BANKING">Net Banking</option>
                </select>
            </div>

            <p class="demo-note">
                This is a demo payment flow. Do not enter real payment details.
            </p>

            <div class="d-flex flex-wrap gap-2 mt-4">
                <button type="submit" class="btn btn-purple">
                    Confirm Demo Payment
                </button>

                <a href="{% url 'dashboard' %}" class="btn btn-outline-purple">
                    Back to Dashboard
                </a>
            </div>
        </form>
    </main>
</body>
</html>
