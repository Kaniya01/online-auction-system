{% if page.paginator.num_pages > 1 %}<nav class="d-flex justify-content-between align-items-center mt-3" aria-label="Page navigation"><span class="small text-secondary">Page {{ page.number }} of {{ page.paginator.num_pages }}</span><div class="btn-group">{% if page.has_previous %}<a class="btn btn-sm btn-outline-primary" href="?page={{ page.previous_page_number }}&q={{ request.GET.q|urlencode }}&status={{ request.GET.status|urlencode }}&active={{ request.GET.active|urlencode }}&seller={{ request.GET.seller|urlencode }}&archived={{ request.GET.archived|urlencode }}">Previous</a>{% endif %}{% if page.has_next %}<a class="btn btn-sm btn-outline-primary" href="?page={{ page.next_page_number }}&q={{ request.GET.q|urlencode }}&status={{ request.GET.status|urlencode }}&active={{ request.GET.active|urlencode }}&seller={{ request.GET.seller|urlencode }}&archived={{ request.GET.archived|urlencode }}">Next</a>{% endif %}</div></nav>{% endif %}
