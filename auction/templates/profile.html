{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | AuctionHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f7f9fc;
            font-family: Arial, sans-serif;
        }

        .profile-container {
            max-width: 800px;
            margin: 50px auto;
        }

        .profile-card {
            background: white;
            border-radius: 15px;
            padding: 35px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .profile-picture {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #eaf0ff;
        }

        .profile-placeholder {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #eaf0ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            color: #1a4fd6;
            margin: auto;
        }

        .profile-label {
            font-weight: 600;
            color: #555;
        }

        .profile-value {
            color: #222;
        }

        .btn-edit {
            background: #1a4fd6;
            color: white;
            border: none;
        }

        .btn-edit:hover {
            background: #123a9e;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container profile-container">

        <div class="profile-card">

            <div class="text-center mb-4">

                {% if profile.profile_picture %}
                <img src="{{ profile.profile_picture.url }}" alt="Profile Picture" class="profile-picture">
                {% else %}
                <div class="profile-placeholder">
                    👤
                </div>
                {% endif %}

                <h2 class="mt-3">
                    {{ profile.full_name }}
                </h2>

            </div>

            <hr>

            <div class="row mb-3">
                <div class="col-sm-4 profile-label">
                    Username
                </div>

                <div class="col-sm-8 profile-value">
                    {{ user.username }}
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-sm-4 profile-label">
                    Email
                </div>

                <div class="col-sm-8 profile-value">
                    {{ user.email }}
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-sm-4 profile-label">
                    Full Name
                </div>

                <div class="col-sm-8 profile-value">
                    {{ profile.full_name }}
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-sm-4 profile-label">
                    Phone Number
                </div>

                <div class="col-sm-8 profile-value">
                    {{ profile.phone_number }}
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-sm-4 profile-label">
                    Role
                </div>

            </div>

            <div class="text-center">

                <a href="{% url 'edit_profile' %}" class="btn btn-edit px-4">
                    Edit Profile
                </a>

            </div>

        </div>

    </div>

</body>

</html>
