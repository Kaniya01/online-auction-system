{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Account security | AuctionHub{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><style>body{background:#f5f8fd;color:#17213b;font-family:Inter,system-ui,sans-serif}.auth-card{max-width:520px;margin:8vh auto;padding:32px;background:#fff;border:1px solid #dfe5ec;border-radius:16px;box-shadow:0 8px 24px #17213b12}.brand{color:#17213b;font-size:1.3rem;font-weight:750;text-decoration:none}.brand i{color:#2155d9}.form-label{font-weight:600}.form-control:focus,.form-select:focus,button:focus-visible,a:focus-visible{outline:3px solid #9ab8ff;outline-offset:2px;box-shadow:none}</style></head><body><main class="auth-card"><a class="brand" href="{% url 'login' %}"><i class="bi bi-hammer"></i> AuctionHub</a><hr>{% if messages %}{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}" role="status">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main></body></html>
